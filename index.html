<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rotating Chess</title>
<style>
:root {
  --bg: #8e9297;
  --ink: #15171a;
  --ink-soft: #2c3036;
  --frame: #23262b;
  --light: #f3f1ea;
  --dark: #25272c;
  --hl: #2f80ed;
  --btn: #23262b;
  --btn-ink: #f4f5f6;
  --ok: #0f5132;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #7f838a; --frame: #1a1c20; --btn: #1a1c20; --hl: #6aa8ff; }
}
:root[data-theme="dark"] { --bg: #7f838a; --frame: #1a1c20; --btn: #1a1c20; --hl: #6aa8ff; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); }
body {
  font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 18px; padding: 24px 16px; min-height: 100vh;
}
h1 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.2rem); font-weight: 800; letter-spacing: -0.01em; }
.hint { margin: 4px 0 0; font-size: .95rem; color: var(--ink-soft); text-align: center; max-width: 46ch; line-height: 1.4; }
header { text-align: center; }
.stats { display: flex; gap: 14px; }
.stat { background: var(--frame); color: var(--btn-ink); border-radius: 12px; padding: 8px 18px; min-width: 130px; text-align: center; }
.stat small { display: block; font-size: .75rem; opacity: .75; }
.stat b { font-size: 1.6rem; font-variant-numeric: tabular-nums; font-family: "Consolas", "Courier New", monospace; }
.wrap { position: relative; width: min(92vw, 62vh, 540px); }
#board {
  position: relative; display: grid; width: 100%; aspect-ratio: 1;
  border: 8px solid var(--frame); border-radius: 10px; background: var(--frame);
  box-shadow: 0 10px 30px rgba(0,0,0,.35); user-select: none; -webkit-user-select: none;
  touch-action: manipulation; cursor: pointer; overflow: hidden; -webkit-touch-callout: none;
}
.cell { position: relative; }
.cell.l { background: var(--light); }
.cell.d { background: var(--dark); }
#hl {
  position: absolute; pointer-events: none; border: 3px solid var(--hl); border-radius: 6px;
  background: rgba(47,128,237,.22); display: none; z-index: 5; transition: left .06s, top .06s;
}
.controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
button, select {
  font: inherit; font-weight: 700; background: var(--btn); color: var(--btn-ink);
  border: 0; border-radius: 10px; padding: 10px 20px; cursor: pointer;
}
select { font-weight: 600; padding: 10px 12px; }
button:hover, select:hover { filter: brightness(1.25); }
button:focus-visible, select:focus-visible { outline: 3px solid var(--hl); outline-offset: 2px; }
#msg { min-height: 1.6em; font-weight: 800; font-size: 1.15rem; color: var(--ok); text-align: center; }
@media (prefers-reduced-motion: reduce) { #hl { transition: none; } }
</style>
</head>
<body>
<header>
  <h1>Rotating Chess</h1>
  <p class="hint">Rotate 2×2 blocks of squares until you form a chessboard. Left click rotates counterclockwise; right click rotates clockwise.</p>
</header>

<div class="stats">
  <div class="stat"><small>Time</small><b id="time">00:00.00</b></div>
  <div class="stat"><small>Moves</small><b id="moves">0</b></div>
</div>

<div class="wrap">
  <div id="board" aria-label="Puzzle board"><div id="hl"></div></div>
</div>

<div id="msg" role="status"></div>

<div class="controls">
  <button id="shuffle">Shuffle</button>
  <select id="size" aria-label="Board size">
    <option value="4">4×4</option>
    <option value="6">6×6</option>
    <option value="8" selected>8×8</option>
  </select>
</div>

<script>
(function () {
  var board = document.getElementById('board');
  var hl = document.getElementById('hl');
  var timeEl = document.getElementById('time');
  var movesEl = document.getElementById('moves');
  var msg = document.getElementById('msg');
  var sizeSel = document.getElementById('size');

  var n = 8, grid = [], cells = [];
  var moves = 0, started = false, won = false, t0 = 0, elapsed = 0, timer = null;

  function fmt(ms) {
    var cs = Math.floor(ms / 10) % 100, s = Math.floor(ms / 1000) % 60, m = Math.floor(ms / 60000);
    return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0') + '.' + String(cs).padStart(2, '0');
  }
  function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }
  function startTimer() {
    t0 = performance.now();
    timer = setInterval(function () { elapsed = performance.now() - t0; timeEl.textContent = fmt(elapsed); }, 40);
  }

  function idx(r, c) { return r * n + c; }

  function isSolved() {
    var a = true, b = true;
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) {
      var v = grid[idx(r, c)], p = (r + c) % 2;
      if (v !== p) a = false;
      if (v === p) b = false;
    }
    return a || b;
  }

  // dir: -1 antihorario, +1 horario. Devuelve los índices [TL, TR, BR, BL] y su origen.
  function rotate(r, c, dir) {
    var pos = [idx(r, c), idx(r, c + 1), idx(r + 1, c + 1), idx(r + 1, c)];
    var old = pos.map(function (i) { return grid[i]; });
    var src = dir > 0 ? [3, 0, 1, 2] : [1, 2, 3, 0];
    pos.forEach(function (p, k) { grid[p] = old[src[k]]; });
    return { pos: pos, src: src };
  }

  function paint() {
    for (var i = 0; i < cells.length; i++) cells[i].className = 'cell ' + (grid[i] ? 'l' : 'd');
  }

  function build() {
    board.querySelectorAll('.cell').forEach(function (e) { e.remove(); });
    board.style.gridTemplateColumns = 'repeat(' + n + ', 1fr)';
    board.style.gridTemplateRows = 'repeat(' + n + ', 1fr)';
    cells = [];
    for (var i = 0; i < n * n; i++) {
      var d = document.createElement('div');
      board.insertBefore(d, hl);
      cells.push(d);
    }
    hl.style.width = (200 / n) + '%';
    hl.style.height = (200 / n) + '%';
  }

  function shuffle() {
    grid = [];
    for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) grid.push((r + c) % 2);
    do {
      for (var k = 0; k < n * n * 12; k++) {
        rotate(Math.floor(Math.random() * (n - 1)), Math.floor(Math.random() * (n - 1)), Math.random() < .5 ? -1 : 1);
      }
    } while (isSolved());
    stopTimer();
    started = false; won = false; moves = 0; elapsed = 0;
    movesEl.textContent = '0';
    timeEl.textContent = fmt(0);
    msg.textContent = '';
    paint();
  }

  function blockAt(e) {
    var rect = board.getBoundingClientRect();
    var bw = board.clientLeft;
    var x = (e.clientX - rect.left - bw) / board.clientWidth * n;
    var y = (e.clientY - rect.top - bw) / board.clientHeight * n;
    var ci = Math.min(n - 1, Math.max(1, Math.round(x)));
    var ri = Math.min(n - 1, Math.max(1, Math.round(y)));
    return { r: ri - 1, c: ci - 1 };
  }

  function showHl(b) {
    hl.style.display = 'block';
    hl.style.left = (b.c * 100 / n) + '%';
    hl.style.top = (b.r * 100 / n) + '%';
  }

  function play(e, dir) {
    if (won) return;
    var b = blockAt(e);
    showHl(b);
    if (!started) { started = true; startTimer(); }
    var res = rotate(b.r, b.c, dir);
    moves++;
    movesEl.textContent = moves;
    paint();
    var cs = cells[0].getBoundingClientRect().width;
    var offs = [[0, 0], [1, 0], [1, 1], [0, 1]];
    if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      res.pos.forEach(function (p, k) {
        var s = offs[res.src[k]], d = offs[k];
        var el = cells[p];
        el.style.zIndex = 3;
        var a = el.animate(
          [{ transform: 'translate(' + (s[0] - d[0]) * 100 + '%,' + (s[1] - d[1]) * 100 + '%)' }, { transform: 'none' }],
          { duration: 150, easing: 'ease-out' }
        );
        a.onfinish = function () { el.style.zIndex = ''; };
      });
    }
    if (isSolved()) {
      won = true; stopTimer();
      elapsed = performance.now() - t0;
      timeEl.textContent = fmt(elapsed);
      msg.textContent = 'Solved in ' + fmt(elapsed) + ' with ' + moves + ' moves!';
      hl.style.display = 'none';
    }
  }

  board.addEventListener('click', function (e) { play(e, -1); });
  board.addEventListener('contextmenu', function (e) { e.preventDefault(); play(e, 1); });
  board.addEventListener('pointermove', function (e) { if (!won) showHl(blockAt(e)); });
  board.addEventListener('pointerleave', function () { hl.style.display = 'none'; });

  document.getElementById('shuffle').addEventListener('click', shuffle);
  sizeSel.addEventListener('change', function () { n = parseInt(sizeSel.value, 10); build(); shuffle(); });

  build();
  shuffle();
})();
</script>
</body>
</html>
